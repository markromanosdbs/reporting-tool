version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reporting-backend
    environment:
      PORT: 3001
      NODE_ENV: production
      AZURE_SQL_SERVER: ${AZURE_SQL_SERVER}
      AZURE_SQL_DATABASE: ${AZURE_SQL_DATABASE}
      AZURE_SQL_USERNAME: ${AZURE_SQL_USERNAME}
      AZURE_SQL_PASSWORD: ${AZURE_SQL_PASSWORD}
      CORS_ORIGIN: http://localhost
    ports:
      - "3001:3001"
    networks:
      - reporting-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reporting-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - reporting-network
    restart: unless-stopped

networks:
  reporting-network:
    driver: bridge
